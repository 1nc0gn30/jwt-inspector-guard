[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "jwt-inspector-guard"
version = "0.1.0"
description = "Pure Python JWT decoder, signature verifier, claims validator & security auditor — zero external dependencies"
readme = "README.md"
license = { text = "MIT" }
keywords = [
    "jwt",
    "security",
    "token",
    "decoder",
    "validator",
    "hmac",
    "mcp",
    "dpop",
    "rfc9449",
    "proof-of-possession",
    "token-binding",
    "anti-replay"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Environment :: Console",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/1nc0gn30/jwt-inspector-guard"
Repository = "https://github.com/1nc0gn30/jwt-inspector-guard"
Issues = "https://github.com/1nc0gn30/jwt-inspector-guard/issues"

[project.scripts]
jwt-inspector-guard = "jwt_inspector_guard.cli:main"
jwt-guard = "jwt_inspector_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jwt_inspector_guard" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["jwt_inspector_guard"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
